<div style="font-family:Georgia,'Times New Roman',serif;max-width:480px;margin:0 auto;padding:32px;color:#2B2320;">

    <p>Hi {{ fullname }},</p>
    <p>We received a request to reset your password. This link expires in {{ minutes_valid }} minutes.</p>
    <p style="text-align:center;margin:28px 0;">
        <a href="{{ reset_url }}" style="background:#7B2D3E;color:#fff;padding:14px 28px;border-radius:100px;text-decoration:none;font-weight:700;display:inline-block;">
            Reset Password
        </a>
    </p>

    <p style="color:#A69C90;font-size:12px;margin-top:32px;">Loop &amp; Love &middot; handmade crochet</p>
</div>
