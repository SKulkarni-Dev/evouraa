<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Loop & Love</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,560;9..144,600;9..144,700&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>
<body>

<div class="auth-wrap">

    <div class="auth-visual">
        <a href="/" class="logo">
            <img src="{{ url_for('static', filename='assets/images/logo.jpeg') }}" alt="Loop & Love">
            <span>Loop &amp; Love</span>
        </a>

        <h1>Choose a new password.</h1>
        <p>Pick something you haven't used before.</p>

        <div class="loop-divider">
            <svg viewBox="0 0 120 40"><path d="M6 30 C 6 10, 34 10, 34 24 C 34 38, 62 38, 62 20 C 62 6, 90 6, 90 24 C 90 34, 110 32, 114 22"/></svg>
        </div>
    </div>

    <div class="auth-form-side">
        <div class="auth-card">

            {% include "_flash.html" %}

            <h2>New Password</h2>

            <form action="{{ url_for('auth.reset_password_submit', token=token) }}" method="POST">

                <div class="field-group">
                    <label>New Password</label>
                    <input type="password" name="password" placeholder="Min. 8 characters" required autofocus>
                </div>

                <div class="field-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn btn-full">Update Password</button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
