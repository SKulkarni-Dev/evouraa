<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Loop & Love</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,560;9..144,600;9..144,700&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>
<body>

<div class="auth-wrap">

    <div class="auth-visual">
        <a href="/" class="logo">
            <img src="{{ url_for('static', filename='assets/images/logo.jpeg') }}" alt="Loop & Love">
            <span>Loop &amp; Love</span>
        </a>

        <h1>Welcome back.</h1>
        <p>Sign in to continue exploring beautiful handmade crochet creations, crafted stitch by stitch.</p>

        <div class="loop-divider">
            <svg viewBox="0 0 120 40"><path d="M6 30 C 6 10, 34 10, 34 24 C 34 38, 62 38, 62 20 C 62 6, 90 6, 90 24 C 90 34, 110 32, 114 22"/></svg>
        </div>
    </div>

    <div class="auth-form-side">
        <div class="auth-card">

            {% include "_flash.html" %}

            <h2>Login</h2>
            <p class="auth-sub">New here? <a href="/register" style="color:var(--berry);font-weight:700;">Create an account</a>.</p>

            <form action="/login" method="POST">

                <div class="field-group">
                    <label>Email or Phone</label>
                    <input type="text" name="email_or_phone" placeholder="Enter email or phone" required>
                </div>

                <div class="field-group">
                    <label>Password</label>
                    <div class="password-box">
                        <input type="password" name="password" id="password" placeholder="Enter password" required>
                        <i class="fa-solid fa-eye" id="togglePassword"></i>
                    </div>
                </div>

                <div class="auth-links">
                    <a href="{{ url_for('auth.forgot_password_page') }}">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-full">Login</button>

            </form>

            <div class="auth-switch">
                Don't have an account? <a href="/register">Create one</a>
            </div>

        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
