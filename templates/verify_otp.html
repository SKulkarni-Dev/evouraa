<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email | Loop & Love</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,560;9..144,600;9..144,700&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>
<body>

<div class="auth-wrap">

    <div class="auth-visual">
        <a href="/" class="logo">
            <img src="{{ url_for('static', filename='assets/images/logo.jpeg') }}" alt="Loop & Love">
            <span>Loop &amp; Love</span>
        </a>

        <h1>Almost there.</h1>
        <p>We've emailed a 6-digit code to {{ email }}. Enter it below to activate your account.</p>

        <div class="loop-divider">
            <svg viewBox="0 0 120 40"><path d="M6 30 C 6 10, 34 10, 34 24 C 34 38, 62 38, 62 20 C 62 6, 90 6, 90 24 C 90 34, 110 32, 114 22"/></svg>
        </div>
    </div>

    <div class="auth-form-side">
        <div class="auth-card">

            {% include "_flash.html" %}

            <h2>Verify Your Email</h2>
            <p class="auth-sub">Check {{ email }} for your code.</p>

            <form action="{{ url_for('auth.verify_otp_submit') }}" method="POST">

                <div class="field-group">
                    <label>6-Digit Code</label>
                    <input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required autofocus>
                </div>

                <button type="submit" class="btn btn-full">Verify &amp; Continue</button>

            </form>

            <form action="{{ url_for('auth.resend_otp') }}" method="POST" style="margin-top:12px;">
                <button type="submit" class="btn-outline btn-full">Resend Code</button>
            </form>

        </div>
    </div>

</div>

</body>
</html>
