<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Loop & Love</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,560;9..144,600;9..144,700&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>
<body>

<div class="auth-wrap">

    <div class="auth-visual">
        <a href="/" class="logo">
            <img src="{{ url_for('static', filename='assets/images/logo.jpeg') }}" alt="Loop & Love">
            <span>Loop &amp; Love</span>
        </a>

        <h1>Forgot your password?</h1>
        <p>No worries — tell us the email on your account and we'll send you a reset link.</p>

        <div class="loop-divider">
            <svg viewBox="0 0 120 40"><path d="M6 30 C 6 10, 34 10, 34 24 C 34 38, 62 38, 62 20 C 62 6, 90 6, 90 24 C 90 34, 110 32, 114 22"/></svg>
        </div>
    </div>

    <div class="auth-form-side">
        <div class="auth-card">

            {% include "_flash.html" %}

            <h2>Reset Password</h2>
            <p class="auth-sub">Remembered it? <a href="/login" style="color:var(--berry);font-weight:700;">Back to login</a>.</p>

            <form action="{{ url_for('auth.forgot_password_submit') }}" method="POST">

                <div class="field-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your account email" required autofocus>
                </div>

                <button type="submit" class="btn btn-full">Send Reset Link</button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
