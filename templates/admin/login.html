<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Loop & Love</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,560;9..144,600;9..144,700&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">

</head>
<body>

<div class="auth-wrap admin-login-wrap">

    <div class="auth-form-side" style="margin:0 auto;">
        <div class="auth-card">

            {% include "_flash.html" %}

            <h2><i class="fa-solid fa-shield-halved"></i>&nbsp; Admin Login</h2>
            <p class="auth-sub">Store management &middot; authorized staff only.</p>

            <form action="{{ url_for('admin_bp.admin_login_submit') }}" method="POST">

                <div class="field-group">
                    <label>Username</label>
                    <input type="text" name="username" required autofocus>
                </div>

                <div class="field-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-full">Sign In</button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
